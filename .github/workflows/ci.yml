name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint & Strict Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  test-matrix:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform matrix testing for Windows-specific file locking & retries
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run unit & invariant test suite
        run: npm run test:coverage

  security-audit:
    name: Security Audit & Native Module Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Cross-platform native binary & toolchain audit
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const exec = require('child_process').execSync;
            function findNodeFiles(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, f.name);
                if (f.isDirectory()) results = results.concat(findNodeFiles(p));
                else if (f.name.endsWith('.node')) results.push(p);
              }
              return results;
            }
            const nodeFiles = findNodeFiles('node_modules');
            let lsOutput = '';
            try { lsOutput = exec('npm ls', { encoding: 'utf8' }) || ''; } catch (e) { lsOutput = e.stdout || ''; }
            const hasToolchain = /node-gyp|node-pre-gyp|prebuild-install|napi-rs|cmake-js/i.test(lsOutput);
            if (nodeFiles.length > 0 || hasToolchain) {
              console.error('Native modules/toolchains detected:', nodeFiles);
              process.exit(1);
            }
            console.log('Verified: Zero native binary files or toolchains found in dependency tree.');
          "

  smoke-install:
    name: Global Package Smoke Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Build tarball package
        id: pack
        run: |
          node -e "
            const fs = require('fs');
            const exec = require('child_process').execSync;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            exec('npm pack');
            const filename = pkg.name + '-' + pkg.version + '.tgz';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + filename + '\n');
            console.log('Created tarball:', filename);
          "

      - name: Install CLI globally from packed tarball
        run: npm install -g ${{ steps.pack.outputs.filename }}

      - name: Add npm global bin directory to PATH
        run: |
          node -e "
            const fs = require('fs');
            const exec = require('child_process').execSync;
            const prefix = exec('npm config get prefix', { encoding: 'utf8' }).trim();
            const binDir = process.platform === 'win32' ? prefix : prefix + '/bin';
            fs.appendFileSync(process.env.GITHUB_PATH, binDir + '\n');
          "

      - name: Test global binary --version
        run: palee --version

      - name: Test global binary --help
        run: palee --help
