name: CD & NPM Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-and-pack:
    name: Verify, Build & Pack Artifact
    runs-on: ubuntu-latest
    outputs:
      package-filename: ${{ steps.pack.outputs.filename }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npx tsc --noEmit

      - name: Run invariant tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Build verified distribution tarball
        id: pack
        run: |
          FILENAME=$(npm pack | tail -n 1)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Created tarball: $FILENAME"

      - name: Upload verified release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.filename }}

  publish-npm:
    name: Publish Tarball to NPM Registry
    needs: verify-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish exact verified tarball to NPM with Provenance
        run: npm publish ${{ needs.verify-and-pack.outputs.package-filename }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [verify-and-pack, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Create GitHub Release with attached artifact
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ needs.verify-and-pack.outputs.package-filename }}
