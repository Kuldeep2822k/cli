name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/package.json'
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs for supply-chain security.
# Periodically verify and update SHAs during dependency review.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build runs the third-party docs toolchain, so it holds no credential
    # that can publish: `pages: write` and `id-token: write` belong to the
    # deploy job alone. `pages: read` stays because `configure-pages` asks the
    # API for the site's base path, and job-level permissions replace (not
    # merge with) the workflow-level grant.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm

      - name: Install dependencies
        # --ignore-scripts matches ci.yml: a malicious transitive postinstall
        # must not run while the docs toolchain is installed.
        run: npm ci --ignore-scripts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
