name: CD & NPM Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify-and-pack:
    name: Verify, Build & Pack Artifact
    runs-on: ubuntu-latest
    outputs:
      package-filename: ${{ steps.pack.outputs.filename }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Check version == tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch! Git tag is v$TAG_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Strict Typecheck & Lint
        run: npm run check

      - name: Run unit & invariant tests
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Build verified distribution tarball
        id: pack
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            execSync('npm pack');
            const filename = pkg.name.replace('@', '').replace('/', '-') + '-' + pkg.version + '.tgz';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + filename + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\n');
            console.log('Created tarball:', filename);
          "

      - name: Dynamic Tarball Assertions
        run: node scripts/verify-tarball.js

      - name: Upload verified release tarball
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.filename }}

  publish-npm:
    name: Publish Tarball to NPM Registry
    needs: verify-and-pack
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Download verified release tarball
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: npm-package

      - name: Check if version is already published
        id: check-published
        run: |
          VERSION=${{ needs.verify-and-pack.outputs.version }}
          if npm view "@kuldeep2822k/palee@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Version ${VERSION} is already published on npm. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM Registry
        if: steps.check-published.outputs.already_published != 'true'
        run: npm publish ${{ needs.verify-and-pack.outputs.package-filename }} --access public --provenance

  github-release:
    name: Create GitHub Release
    needs: [verify-and-pack, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified release tarball
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: npm-package

      - name: Create GitHub Release with attached artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ needs.verify-and-pack.outputs.package-filename }}

  smoke-test:
    name: Post-Release Smoke Test on Windows
    needs: [verify-and-pack, publish-npm]
    runs-on: windows-latest
    steps:
      - name: Use Node.js 24.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.x

      - name: Install published package globally
        shell: bash
        run: |
          VERSION=${{ needs.verify-and-pack.outputs.version }}
          echo "Waiting for npm registry to propagate @kuldeep2822k/palee@$VERSION..."
          for i in {1..12}; do
            if npm install -g @kuldeep2822k/palee@$VERSION; then
              echo "Successfully installed @kuldeep2822k/palee@$VERSION!"
              exit 0
            fi
            echo "NPM registry lag. Retrying in 10 seconds..."
            sleep 10
          done
          echo "Failed to install @kuldeep2822k/palee@$VERSION after 2 minutes."
          exit 1

      - name: Verify Exact Version Match
        shell: pwsh
        run: |
          $EXPECTED = "${{ needs.verify-and-pack.outputs.version }}"
          $ACTUAL = (palee --version).Trim()
          if ($ACTUAL -ne $EXPECTED) {
            Write-Error "❌ Version mismatch! Expected $EXPECTED, got $ACTUAL"
            exit 1
          }
          Write-Output "✅ Version match: $ACTUAL"

      - name: Test global binary --help
        run: palee --help
