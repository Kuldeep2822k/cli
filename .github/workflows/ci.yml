name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

  test-matrix:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform matrix testing for Windows-specific file locking & retries
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & invariant test suite
        run: npm test

  security-audit:
    name: Security Audit & Native Module Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Strict native binary & toolchain audit
        run: |
          NATIVE_FILES=$(find node_modules -type f -name "*.node" 2>/dev/null | wc -l || true)
          TOOLCHAIN_COUNT=$(npm ls | grep -iE "node-gyp|node-pre-gyp|prebuild-install|napi-rs|cmake-js" | wc -l || true)
          if [ "$NATIVE_FILES" -gt 0 ] || [ "$TOOLCHAIN_COUNT" -gt 0 ]; then
            echo "Error: Detected native C/C++ binaries or build toolchains in node_modules!"
            find node_modules -type f -name "*.node"
            exit 1
          fi
          echo "Verified: Zero native binary files or toolchains found in dependency tree."

  smoke-install:
    name: Global Package Smoke Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Build production bundle
        run: npm run build

      - name: Install CLI globally from source
        run: |
          npm install -g .
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "$(npm config get prefix)" >> $GITHUB_PATH
          else
            echo "$(npm config get prefix)/bin" >> $GITHUB_PATH
          fi
        shell: bash

      - name: Test global binary --version
        run: palee --version

      - name: Test global binary --help
        run: palee --help
