name: CodeRabbit Trigger Probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post one CodeRabbit rate-limit probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Kuldeep2822k/cli/issues/458/comments \
            --method POST \
            --raw-field body='@coderabbitai rate limit'

      # Runs only if the POST above failed. Re-issues the same request with curl
      # and dumps the response headers so a 403 shows X-Accepted-GitHub-Permissions
      # (the exact permission set GitHub requires for this endpoint on this token).
      - name: Diagnose permissions on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -o probe-response.json \
            -D probe-headers.txt \
            --data '{"body":"@coderabbitai rate limit"}' \
            https://api.github.com/repos/Kuldeep2822k/cli/issues/458/comments
          echo '--- response headers ---'
          cat probe-headers.txt
          echo '--- response body ---'
          cat probe-response.json
          echo '--- accepted permissions ---'
          grep -i 'x-accepted-github-permissions' probe-headers.txt || echo '(header not present in response)'
