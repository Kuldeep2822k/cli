name: Issue Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  actions: write

jobs:
  label-issues:
    name: Label by title prefix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: issue-labeler-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Label issue by title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // --- Fetch fresh issue state to avoid race conditions with rapid edits ---
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });

            const title = issue.title || '';
            const lowerTitle = title.toLowerCase();
            const lowerBody = (issue.body || '').toLowerCase();
            const existingLabels = new Set(issue.labels.map(l => typeof l === 'string' ? l : l.name));

            const toAdd = [];
            const toRemove = [];

            // --- Type labels from title prefix (mutually exclusive) ---
            // Type labels are derived from the title prefix. When the prefix changes
            // to a different recognized type, the old one is removed.
            const typeLabels = ['bug', 'refactor', 'enhancement', 'documentation', 'chore'];
            let intendedType = null;
            let titleScope = null;

            // Matches prefixes like "Fix: ...", "fix(storage): ...", "[Bug]: ...", "[Bug] ...", "Task: ..."
            const prefixRegex = /^(?:\[([A-Za-z\s-]+)\](?::\s*|\s+)|([A-Za-z][\w\s-]*?)(?:\(([^)]+)\))?:\s*)(.*)$/;
            const prefixMatch = title.match(prefixRegex);

            if (prefixMatch) {
              const rawPrefix = (prefixMatch[1] || prefixMatch[2] || '').trim().toLowerCase();
              titleScope = (prefixMatch[3] || '').trim().toLowerCase();

              if (['bug', 'fix', 'bugfix', 'hotfix'].includes(rawPrefix)) {
                intendedType = 'bug';
              } else if (['feature', 'feat', 'enhancement', 'request'].includes(rawPrefix)) {
                intendedType = 'enhancement';
              } else if (['docs', 'doc', 'documentation'].includes(rawPrefix)) {
                intendedType = 'documentation';
              } else if (['task', 'chore', 'cleanup', 'maintenance', 'maint'].includes(rawPrefix)) {
                intendedType = 'chore';
              } else if (['refactor', 'refactoring', 'perf', 'performance'].includes(rawPrefix)) {
                intendedType = 'refactor';
              }
            }

            // Fallback type inference for issues opened without a conventional prefix
            if (!intendedType) {
              if (/\b(bug|crash|segfault|broken)\b/.test(lowerTitle)) {
                intendedType = 'bug';
              } else if (/\b(feature|rfc|proposal)\b/.test(lowerTitle)) {
                intendedType = 'enhancement';
              } else if (/\b(docs?|documentation)\b/.test(lowerTitle) && !lowerTitle.includes('skip docs')) {
                intendedType = 'documentation';
              } else if (/\b(chore|cleanup|clean up|housekeeping)\b/.test(lowerTitle)) {
                intendedType = 'chore';
              } else if (/\b(refactor|refactoring)\b/.test(lowerTitle)) {
                intendedType = 'refactor';
              }
            }

            if (intendedType) {
              // Remove other type labels so they stay mutually exclusive.
              for (const label of typeLabels) {
                if (label !== intendedType && existingLabels.has(label)) {
                  toRemove.push(label);
                }
              }
              if (!existingLabels.has(intendedType)) {
                toAdd.push(intendedType);
              }
            }

            // --- Subsystem labels from conventional commit scope (e.g. fix(storage): ...) ---
            const scopeMap = {
              core: 'core',
              engine: 'core',
              storage: 'storage',
              vault: 'storage',
              cli: 'cli',
              app: 'application',
              application: 'application',
              types: 'types',
              test: 'tests',
              tests: 'tests',
              build: 'build',
              ci: 'ci',
              action: 'ci',
              actions: 'ci',
              deps: 'dependencies',
              dependencies: 'dependencies',
              security: 'security',
              ai: 'AI',
              doc: 'documentation',
              docs: 'documentation',
              documentation: 'documentation',
            };
            if (titleScope && scopeMap[titleScope] && !existingLabels.has(scopeMap[titleScope]) && !toAdd.includes(scopeMap[titleScope])) {
              toAdd.push(scopeMap[titleScope]);
            }

            // --- Subsystem labels from Issue Form dropdowns ---
            if (/###\s+(?:scope|area)\s+[\s\S]*?(?:core engine|core scheduling|dependency chain)/i.test(issue.body || '')) {
              if (!existingLabels.has('core') && !toAdd.includes('core')) toAdd.push('core');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?(?:storage|vault scanning|session memory|session continuity|obsidian)/i.test(issue.body || '')) {
              if (!existingLabels.has('storage') && !toAdd.includes('storage')) toAdd.push('storage');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?(?:cli\s*\/\s*bin layer|cli ux)/i.test(issue.body || '')) {
              if (!existingLabels.has('cli') && !toAdd.includes('cli')) toAdd.push('cli');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?tests/i.test(issue.body || '')) {
              if (!existingLabels.has('tests') && !toAdd.includes('tests')) toAdd.push('tests');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?build\s*\/\s*ci/i.test(issue.body || '')) {
              if (!existingLabels.has('ci') && !toAdd.includes('ci')) toAdd.push('ci');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?ai\s*\/\s*phase 2/i.test(issue.body || '')) {
              if (!existingLabels.has('AI') && !toAdd.includes('AI')) toAdd.push('AI');
            }
            if (/###\s+(?:scope|area)\s+[\s\S]*?documentation/i.test(issue.body || '')) {
              if (!existingLabels.has('documentation') && !toAdd.includes('documentation')) toAdd.push('documentation');
            }

            // --- Content-based heuristic labels (add-only) ---
            const heuristics = new Map([
              ['ci', /\bci\b/.test(lowerTitle) || /\b(github actions?|workflows?|ci\.yml)\b/.test(lowerTitle) || lowerBody.includes('ci.yml') || lowerBody.includes('github action')],
              ['dependencies', /\b(deps?|dependencies|package(-lock)?\.json|renovate)\b/.test(lowerTitle) || lowerBody.includes('npm ci') || lowerBody.includes('package.json')],
              ['storage', /\b(vault|frontmatter|containment|atomic-write|hot\.md)\b/.test(lowerTitle) || lowerBody.includes('src/storage/')],
              ['core', /\b(sm-2|sm2|mastery|scheduling)\b/.test(lowerTitle) || lowerBody.includes('src/engine/')],
              ['cli', /\b(cli|palee\s+\w+|--json)\b/.test(lowerTitle) || lowerBody.includes('src/cli/')],
              ['tests', /\b(tests?|coverage|jest|test suite)\b/.test(lowerTitle) || lowerBody.includes('test/')],
              ['security', lowerTitle.includes('security') || lowerBody.includes('security') || lowerBody.includes('vulnerab')],
              ['breaking', lowerTitle.includes('breaking') || lowerBody.includes('breaking change')],
              ['AI', /\bai\b/.test(lowerTitle) || lowerBody.includes('phase 2 ai')],
              ['priority: critical', lowerTitle.includes('priority: critical') || lowerBody.includes('priority: critical') || /\bp1\b/.test(lowerTitle)],
              ['priority: high', lowerTitle.includes('priority: high') || lowerBody.includes('priority: high') || /\bp2\b/.test(lowerTitle)],
              ['priority: medium', lowerTitle.includes('priority: medium') || lowerBody.includes('priority: medium') || /\bp3\b/.test(lowerTitle)],
              ['priority: low', lowerTitle.includes('priority: low') || lowerBody.includes('priority: low')],
              ['good first issue', lowerTitle.includes('good first') || lowerBody.includes('good first issue')],
              ['help wanted', lowerTitle.includes('help wanted') || lowerBody.includes('help wanted')],
            ]);

            for (const [label, shouldAdd] of heuristics) {
              if (shouldAdd && !existingLabels.has(label) && !toAdd.includes(label)) {
                toAdd.push(label);
              }
            }

            // --- Apply changes ---
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: toAdd
              });
              console.log('Added:', toAdd.join(', '));
            }

            // Guard each removal: the label may have been removed between our fresh read and now.
            if (toRemove.length > 0) {
              for (const label of toRemove) {
                if (existingLabels.has(label)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: label
                    });
                    console.log('Removed:', label);
                  } catch (e) {
                    // Only ignore 404 (label not found). Re-throw all other errors.
                    if (e.status === 404) {
                      console.log('Skip removal (already gone):', label);
                    } else {
                      throw e;
                    }
                  }
                }
              }
            }

            if (toAdd.length === 0 && toRemove.length === 0) {
              console.log('No label changes needed.');
            } else {
              // Trigger a re-sync of project fields, since label changes made with the
              // default GITHUB_TOKEN don't fire labeled/unlabeled events that would
              // trigger sync-project-fields.yml automatically.
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync-project-fields.yml',
                ref: 'main',
                inputs: { 'issue-number': String(issue.number) },
              });
              console.log('Triggered sync-project-fields for #' + issue.number);
            }
