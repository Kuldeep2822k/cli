name: Temporary Audit Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit fix
        run: npm audit fix

      - name: Remove temporary workflow
        run: rm .github/workflows/_audit-fix.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/_audit-fix.yml
          if git diff --cached --quiet; then
            echo "No changes produced by npm audit fix."
            exit 0
          fi
          git commit -m "fix: apply npm audit fixes"
          git push origin HEAD:${{ github.head_ref }}
