name: CD & NPM Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-and-pack:
    name: Verify, Build & Pack Artifact
    runs-on: ubuntu-latest
    outputs:
      package-filename: ${{ steps.pack.outputs.filename }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict Typecheck & Lint
        run: npm run lint

      - name: Run unit & invariant tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Build verified distribution tarball
        id: pack
        run: |
          node -e "
            const fs = require('fs');
            const exec = require('child_process').execSync;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            exec('npm pack');
            const filename = pkg.name + '-' + pkg.version + '.tgz';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + filename + '\n');
            console.log('Created tarball:', filename);
          "

      - name: Upload verified release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.filename }}

  publish-npm:
    name: Publish Tarball to NPM Registry
    needs: verify-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Download verified release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish exact verified tarball to NPM with Provenance
        run: |
          if ! npm publish ${{ needs.verify-and-pack.outputs.package-filename }} --provenance --access public; then
            echo "Error: NPM publish failed!"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [verify-and-pack, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Create GitHub Release with attached artifact
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ needs.verify-and-pack.outputs.package-filename }}
