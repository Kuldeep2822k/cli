name: Sync Project Fields

# Syncs issue labels → single-select fields (Priority, Issue Type, AI surface,
# Iteration) on the user-level project "PALEE roadmap":
# https://github.com/users/Kuldeep2822k/projects/3
#
# Mirrors the one-shot migration of 2026-09 (apply-migration.ps1), dropping its
# per-issue-number special cases. Field/option IDs are resolved by NAME at
# runtime, so editing options in the project UI does not break this workflow.

on:
  issues:
    types:
      - opened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Issue number to re-sync (recomputes every field from current labels)'
        required: true

# GITHUB_TOKEN only needs the REST issue lookup; all project reads/writes go
# through PROJECT_PAT (user-level project — see the step below).
permissions:
  issues: read

# Serialize runs per issue: label edits fire bursts of events and queued runs
# can execute out of order, so coalescing same-issue runs (every one recomputes
# from current labels — last-write-wins) is safe, while different issues never
# queue behind each other.
concurrency:
  group: sync-project-fields-${{ github.event.issue.number || inputs['issue-number'] }}
  cancel-in-progress: false

jobs:
  sync-fields:
    name: Sync issue labels to PALEE roadmap fields
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute and write project fields
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # PALEE roadmap is a USER-level project; the repository GITHUB_TOKEN
          # cannot modify it. Set the PROJECT_PAT secret (classic PAT with the
          # "project" scope) and it is used automatically.
          github-token: ${{ secrets.PROJECT_PAT || github.token }}
          retries: 3
          script: |
            const PROJECT_ID = 'PVT_kwHOB_VdDM4Bic4L'
            const PROJECT_URL = 'https://github.com/users/Kuldeep2822k/projects/3'

            // ── Label → option-name rules (same precedence as the migration) ──
            const priorityFrom = (labels) =>
              labels.includes('priority: critical') ? 'P0' :
              labels.includes('priority: high') || labels.includes('P1') ? 'P1' :
              labels.includes('priority: medium') || labels.includes('P2') ? 'P2' :
              labels.includes('priority: low') || labels.includes('P3') ? 'P3' : 'P4'

            const typeFrom = (labels) =>
              ['bug', 'refactor', 'documentation', 'chore', 'enhancement']
                .find((t) => labels.includes(t)) || null // null → leave unset

            const aiFrom = (labels) => labels.includes('AI') ? 'AI' : 'None'

            const iterationFrom = (labels) =>
              labels.includes('release: major') ? '0.5.0' :
              labels.includes('release: minor') ? '0.4.2' :
              labels.includes('phase 2 redefine') || labels.includes('Phase-2 redefine') ? 'Phase 2 AI' :
              'Backlog'

            // ── Which issue, and how aggressively to write ──────────────────
            const number = context.eventName === 'workflow_dispatch'
              ? parseInt(context.payload.inputs['issue-number'], 10)
              : context.payload.issue?.number
            if (!number) { core.setFailed('No issue number in event payload'); return }
            // opened → only fill unset fields; labeled/unlabeled/dispatch → recompute
            const overwrite = context.payload.action !== 'opened'

            try {
              // The event payload's label list is a snapshot from event time,
              // and queued runs can execute out of order, so always map from
              // the issue's CURRENT labels — every run is idempotent and
              // event-order-proof.
              const { data: issueData } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
              })
              if (issueData.pull_request) {
                core.setFailed(`#${number} is a pull request — this workflow syncs issues only`)
                return
              }
              const issue = { number, node_id: issueData.node_id, labels: issueData.labels }

              const labels = issue.labels.map((l) => l.name)
              const desired = {
                'Priority': priorityFrom(labels),
                'Issue Type': typeFrom(labels),
                'AI surface': aiFrom(labels),
                'Iteration': iterationFrom(labels),
              }
              core.info(`Issue #${issue.number} [${labels.join(', ') || 'no labels'}] → ${JSON.stringify(desired)}`)

              // Follow a paginated connection to the end. Page size is the
              // GraphQL max (100), so this loop stays dormant until a
              // connection actually outgrows one page.
              const pageThrough = async (firstPage, run) => {
                const nodes = [...firstPage.nodes]
                let page = firstPage
                while (page.pageInfo?.hasNextPage) {
                  page = await run(page.pageInfo.endCursor)
                  nodes.push(...page.nodes)
                }
                return nodes
              }

              // ── Field and option IDs, resolved by name ────────────────────
              const fieldsQuery = `query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on ProjectV2 {
                    fields(first: 100, after: $after) {
                      nodes {
                        ... on ProjectV2FieldCommon { id name }
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }`
              const fieldsPage = await github.graphql(fieldsQuery, { id: PROJECT_ID, after: null })
              if (!fieldsPage.node) {
                throw new Error(`Project ${PROJECT_ID} is not visible to this token (deleted, or the token can't see user-level projects)`)
              }
              const fields = new Map()
              const fieldNodes = await pageThrough(fieldsPage.node.fields, (after) =>
                github.graphql(fieldsQuery, { id: PROJECT_ID, after }).then((r) => r.node.fields))
              for (const f of fieldNodes) {
                if (f.options) {
                  fields.set(f.name, { id: f.id, options: new Map(f.options.map((o) => [o.name, o.id])) })
                }
              }

              // ── Find (or add) the issue's item in the project ────────────
              const itemQuery = `query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 100, after: $after) {
                      nodes {
                        id
                        project { id }
                        fieldValues(first: 100) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field { ... on ProjectV2FieldCommon { name } }
                              name
                            }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }`
              const itemsPage = await github.graphql(itemQuery, { id: issue.node_id, after: null })
              if (!itemsPage.node) { throw new Error(`Issue #${number} not found — was it deleted?`) }
              const itemNodes = await pageThrough(itemsPage.node.projectItems, (after) =>
                github.graphql(itemQuery, { id: issue.node_id, after }).then((r) => r.node.projectItems))
              const existing = itemNodes.find((n) => n.project.id === PROJECT_ID)

              let itemId
              const current = {}
              if (existing) {
                itemId = existing.id
                const valuesQuery = `query($id: ID!, $after: String) {
                  node(id: $id) {
                    ... on ProjectV2Item {
                      fieldValues(first: 100, after: $after) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field { ... on ProjectV2FieldCommon { name } }
                            name
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`
                const valueNodes = await pageThrough(existing.fieldValues, (after) =>
                  github.graphql(valuesQuery, { id: itemId, after }).then((r) => r.node.fieldValues))
                for (const v of valueNodes) {
                  if (v.field) current[v.field.name] = v.name
                }
              } else {
                const addMutation = `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`
                const added = await github.graphql(addMutation, {
                  projectId: PROJECT_ID,
                  contentId: issue.node_id,
                })
                itemId = added.addProjectV2ItemById.item.id
                core.info(`Issue #${issue.number} was not in the project — added to ${PROJECT_URL}`)
              }

              // ── Write the fields ─────────────────────────────────────────
              const updateMutation = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`
              for (const [name, option] of Object.entries(desired)) {
                if (option === null) { core.info(`${name}: no matching label — left as-is`); continue }
                const field = fields.get(name)
                if (!field) { core.warning(`Project has no "${name}" field — skipped`); continue }
                const optionId = field.options.get(option)
                if (!optionId) { core.warning(`Field "${name}" has no option "${option}" — skipped`); continue }
                if (current[name] === option) { core.info(`${name}: already "${option}"`); continue }
                if (!overwrite && current[name]) {
                  core.info(`${name}: manually set to "${current[name]}" — not overridden`)
                  continue
                }
                await github.graphql(updateMutation, {
                  projectId: PROJECT_ID,
                  itemId,
                  fieldId: field.id,
                  optionId,
                })
                core.info(`${name}: "${current[name] || 'unset'}" → "${option}"`)
              }
              core.info(`Synced issue #${issue.number} → ${PROJECT_URL}`)
            } catch (err) {
              const hint = process.env.PROJECT_PAT_SET === 'true'
                ? ''
                : '\nThis run used the repository GITHUB_TOKEN, which cannot modify user-level projects ' +
                  '(PALEE roadmap is a user project). Create a classic PAT with the "project" scope and ' +
                  'save it as the PROJECT_PAT secret.'
              core.setFailed(`${err.message}${hint}`)
            }
        env:
          PROJECT_PAT_SET: ${{ secrets.PROJECT_PAT != '' }}
