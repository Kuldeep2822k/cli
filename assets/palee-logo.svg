<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </radialGradient>

    <!-- Colors -->
    <!-- Cobalt Blues -->
    <linearGradient id="bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Emerald Greens -->
    <linearGradient id="greenPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="greenBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Arrowhead Markers -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <g transform="translate(256, 256)">
    <!-- OUTER ISOMETRIC HEXAGON SEGMENTS -->

    <!-- Top-Left Segment (Blue) -->
    <path d="M -15,-230 L -140,-158 L -140,-130 L -15,-202 Z" fill="#2563EB" />
    <path d="M -140,-158 L -140,-130 L -120,-130 L -120,-150 Z" fill="#1D4ED8" />

    <!-- Top-Right Segment (Green) -->
    <path d="M 15,-230 L 140,-158 L 120,-146 L 15,-206 Z" fill="#10B981" />
    <path d="M 15,-230 L 15,-206 L 0,-215 Z" fill="#059669" />

    <!-- Right Vertical Segment (Blue) -->
    <path d="M 148,-142 L 148,85 L 128,73 L 128,-130 Z" fill="#2563EB" />

    <!-- Bottom-Right Segment (Green) -->
    <path d="M 140,98 L 15,170 L 15,146 L 120,86 Z" fill="#10B981" />
    <path d="M 15,170 L 15,146 L 0,155 Z" fill="#059669" />

    <!-- Bottom-Left Vertical Segment / Stem (Green) -->
    <path d="M -15,80 L -15,170 L -35,158 L -35,80 Z" fill="#10B981" />
    <path d="M -15,80 L -35,80 L -35,92 Z" fill="#059669" />

    <!-- Left Lower & Vertical Segment (Blue) -->
    <path d="M -148,85 L -148,-142 L -128,-130 L -128,73 Z" fill="#2563EB" />
    <path d="M -148,85 L -90,118 L -90,100 L -128,78 Z" fill="#1D4ED8" />

    <!-- CENTER "P" ISOMETRIC BLOCK -->
    <g transform="translate(0, -10)">
      <!-- Front Face of P -->
      <path d="M -25,-55 L 25,-26 L 25,12 L 5,24 L -15,12 L -15,35 L -35,23 L -35,-49 Z" fill="#10B981" />
      <!-- Inner Hollow of P -->
      <path d="M -15,-38 L 8,-24 L 8,-2 L -15,-15 Z" fill="#070A12" opacity="0.95" />
      <!-- Shaded Facets of P -->
      <path d="M -25,-55 L -35,-49 L -35,23 L -25,17 Z" fill="#059669" />
      <path d="M 25,-26 L 35,-32 L 35,6 L 25,12 Z" fill="#059669" />
      <path d="M -25,-55 L -15,-61 L 35,-32 L 25,-26 Z" fill="#34D399" />
    </g>

    <!-- DIRECTED GRAPH OVERLAY (DAG) -->

    <!-- Directed Edge: Top-Left to Mid-Left -->
    <line x1="-120" y1="-100" x2="-75" y2="-72" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)" />

    <!-- Directed Edge: Upper-Left to Top -->
    <line x1="-65" y1="-65" x2="-8" y2="-105" stroke="#10B981" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)" />

    <!-- Directed Edge: Upper-Left to Mid-Left -->
    <line x1="-65" y1="-50" x2="-65" y2="-20" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)" />

    <!-- Directed Edge: Top to Upper-Right -->
    <line x1="12" y1="-115" x2="68" y2="-82" stroke="#10B981" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)" />

    <!-- Directed Edge: Upper-Right to Mid-Right -->
    <line x1="80" y1="-65" x2="80" y2="-20" stroke="#10B981" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)" />

    <!-- Directed Edge: Mid-Right to Lower-Center -->
    <line x1="80" y1="5" x2="20" y2="40" stroke="#2563EB" stroke-width="7" stroke-linecap="round" />

    <!-- Directed Edge: Mid-Left to Lower-Center -->
    <line x1="-50" y1="5" x2="-10" y2="28" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)" />

    <!-- Directed Edge: Mid-Left to Bottom-Left -->
    <line x1="-65" y1="20" x2="-65" y2="60" stroke="#10B981" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)" />

    <!-- GRAPH VERTEX NODES -->

    <!-- Node 1: Outer Top-Left (Blue) -->
    <circle cx="-135" cy="-110" r="16" fill="url(#blueBright)" stroke="#1D4ED8" stroke-width="2.5" />

    <!-- Node 2: Upper-Left (Blue) -->
    <circle cx="-70" cy="-65" r="16" fill="url(#blueBright)" stroke="#1D4ED8" stroke-width="2.5" />

    <!-- Node 3: Top (Green) -->
    <circle cx="0" cy="-122" r="16" fill="url(#greenBright)" stroke="#059669" stroke-width="2.5" />

    <!-- Node 4: Upper-Right (Blue) -->
    <circle cx="80" cy="-75" r="16" fill="url(#blueBright)" stroke="#1D4ED8" stroke-width="2.5" />

    <!-- Node 5: Mid-Right (Green) -->
    <circle cx="80" cy="-8" r="16" fill="url(#greenBright)" stroke="#059669" stroke-width="2.5" />

    <!-- Node 6: Lower-Center (Blue) -->
    <circle cx="0" cy="50" r="16" fill="url(#blueBright)" stroke="#1D4ED8" stroke-width="2.5" />

    <!-- Node 7: Mid-Left (Blue) -->
    <circle cx="-65" cy="0" r="16" fill="url(#blueBright)" stroke="#1D4ED8" stroke-width="2.5" />

    <!-- Node 8: Bottom-Left (Green) -->
    <circle cx="-65" cy="78" r="16" fill="url(#greenBright)" stroke="#059669" stroke-width="2.5" />
  </g>
</svg>
